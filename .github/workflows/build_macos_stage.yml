name: Hybrid macOS IPA Stage (Metal + Xcode)

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Nintendo Switch Title ID (16 hex chars)'
        required: true
        default: '0100F2C0115B0000'
      payload_source:
        description: 'Payload source (e.g. release:tag or url)'
        required: true
        default: 'release:hybrid-payload-0100f2c0115b0000'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner SSD space (~25 GB extra)
        run: |
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /opt/android
          sudo rm -rf /Library/Developer/CommandLineTools
          df -h

      - name: Install Homebrew & Python dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install --break-system-packages lz4 capstone fonttools zstandard || pip install lz4 capstone fonttools zstandard

      - name: Download Hybrid Payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_ipa_windows_hybrid.py --download-payload "${{ github.event.inputs.payload_source }}" --title-id "${{ github.event.inputs.title_id }}" || true

      - name: Compile Metal Shaders & Build iOS App Bundle
        run: |
          echo "Running macOS packaging stage for Title ID: ${{ github.event.inputs.title_id }}"
          # Add execution steps for Xcode build here if available in your repo scripts

      - name: Upload Compiled macOS Stage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ipa-${{ github.event.inputs.title_id }}
          path: |
            *.ipa
            build/**/*.ipa