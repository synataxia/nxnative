name: Hybrid macOS IPA Stage (Metal + Xcode)

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Nintendo Switch Title ID (16 hex chars)'
        required: true
        default: '0100F2C0115B0000'
      payload_source:
        description: 'Payload source (e.g. release:tag or url)'
        required: true
        default: 'release:hybrid-payload-0100f2c0115b0000'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner SSD space (~25 GB extra)
        run: |
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /opt/android
          sudo rm -rf /Library/Developer/CommandLineTools
          df -h

      - name: Install Dependencies & Xcode Tools
        run: |
          brew install xcodegen zstd spirv-cross glslang --quiet || true
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install --break-system-packages lz4 capstone fonttools zstandard || true

      - name: Download Payload & ROM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="hybrid-payload-$(echo ${{ github.event.inputs.title_id }} | tr '[:upper:]' '[:lower:]')"
          gh release download "$tag" -R "${{ github.repository }}"
          mkdir -p game_input
          unzip -o "*.zip" -d game_input
          ls -la game_input

      - name: Inspect Build Script Usage
        run: |
          python3 scripts/build_ipa_from_nsp.py --help || true

      - name: Compile IPA via nxnative pipeline
        run: |
          echo "Running build script with verbose diagnostics..."
          python3 scripts/build_ipa_from_nsp.py game_input/Arceus.xci -k game_input/prod.keys --title-id "${{ github.event.inputs.title_id }}"
          
          mkdir -p build/output
          find . -maxdepth 3 -name "*.ipa" -exec cp {} build/output/ \;
          ls -la build/output

      - name: Upload Compiled macOS Stage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ipa-${{ github.event.inputs.title_id }}
          path: build/output/*.ipa