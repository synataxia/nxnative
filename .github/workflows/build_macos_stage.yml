name: Hybrid macOS IPA Stage (Metal + Xcode)

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Nintendo Switch Title ID (16 hex chars)'
        required: true
        default: '0100F2C0115B0000'
      payload_source:
        description: 'Payload source (e.g. release:tag or url)'
        required: true
        default: 'release:hybrid-payload-0100f2c0115b0000'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner SSD space (~25 GB extra)
        run: |
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /opt/android
          sudo rm -rf /Library/Developer/CommandLineTools
          df -h

      - name: Install Homebrew & Python dependencies & Xcode tools
        run: |
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install --break-system-packages lz4 capstone fonttools zstandard || pip install lz4 capstone fonttools zstandard
          brew install xcodegen || true

      - name: Download and Unpack Payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="hybrid-payload-$(echo ${{ github.event.inputs.title_id }} | tr '[:upper:]' '[:lower:]')"
          gh release download "$tag" -R "${{ github.repository }}" || true
          mkdir -p work_payload
          unzip -o "*.zip" -d work_payload || true
          ls -la work_payload

      - name: Compile IPA
        run: |
          echo "Running build pipeline for Title ID: ${{ github.event.inputs.title_id }}"
          mkdir -p build/output
          python3 scripts/build_ipa_from_nsp.py work_payload --title-id "${{ github.event.inputs.title_id }}" --output build/output/PokemonLegendsArceus.ipa || python3 scripts/build_ipa_from_nsp.py --title-id "${{ github.event.inputs.title_id }}" --output build/output/PokemonLegendsArceus.ipa || true
          find . -maxdepth 3 -name "*.ipa" -exec cp {} build/output/ \; || true
          ls -la build/output

      - name: Upload Compiled macOS Stage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ipa-${{ github.event.inputs.title_id }}
          path: build/output/*.ipa